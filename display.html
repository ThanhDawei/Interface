<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Màn Hình Khách Hàng</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f7f6;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      .banner-side {
        flex: 6;
        background: url("https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=2047&auto=format&fit=crop")
          center/cover;
        box-shadow: inset -10px 0 20px rgba(0, 0, 0, 0.1);
      }

      .order-side {
        flex: 4;
        background: white;
        display: flex;
        flex-direction: column;
        z-index: 10;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.05);
      }
      .header {
        padding: 25px;
        background: #2c3e50;
        color: white;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .item-list {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .item {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid #f0f0f0;
        padding-bottom: 15px;
        animation: slideIn 0.3s ease;
      }
      .item img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 12px;
        margin-right: 15px;
        background: #eee;
        border: 1px solid #ddd;
      }

      .item-info {
        flex: 1;
      }
      .item-name {
        font-size: 16px;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
        line-height: 1.4;
      }
      .item-qty {
        font-weight: bold;
        color: #e74c3c;
        font-size: 18px;
        margin-right: 20px;
      }
      .item-price {
        font-weight: bold;
        font-size: 18px;
        color: #2c3e50;
      }

      .totals {
        padding: 25px;
        background: #f8f9fa;
        border-top: 2px solid #eee;
      }
      .totals-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 16px;
        color: #555;
      }
      .totals-row.grand {
        font-size: 28px;
        font-weight: bold;
        color: #e74c3c;
        margin-top: 15px;
        border-top: 2px dashed #ccc;
        padding-top: 15px;
      }

      .qr-code {
        text-align: center;
        margin-top: 20px;
        display: none;
        background: white;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #eee;
      }
      .qr-code img {
        width: 180px;
        height: 180px;
      }

      .empty-state {
        text-align: center;
        color: #95a5a6;
        margin-top: 80px;
        font-size: 20px;
        font-weight: 500;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="banner-side"></div>
    <div class="order-side">
      <div class="header">ĐƠN HÀNG CỦA BẠN</div>

      <div class="item-list" id="itemList">
        <div class="empty-state">
          <img
            src="https://cdn-icons-png.flaticon.com/512/3081/3081840.png"
            style="width: 100px; opacity: 0.3; margin-bottom: 20px"
          /><br />
          Xin chào quý khách!<br />Vui lòng chọn món tại quầy...
        </div>
      </div>

      <div class="totals" id="totalsBox" style="display: none">
        <div class="totals-row">
          <span>Tạm tính:</span><span id="tSub">0 đ</span>
        </div>
        <div class="totals-row" style="color: #2ecc71; font-weight: bold">
          <span>Giảm giá:</span><span id="tDis">-0 đ</span>
        </div>
        <div class="totals-row grand">
          <span>CẦN THANH TOÁN:</span><span id="tTot">0 đ</span>
        </div>

        <div class="qr-code" id="qrBox">
          <p
            style="
              margin: 0 0 10px 0;
              font-weight: bold;
              color: #2c3e50;
              font-size: 16px;
            "
          >
            Mã QR Thanh Toán Tự Động
          </p>
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PAYMENT_DEMO_QR_CODE"
            alt="QR Code"
          />
        </div>
      </div>
    </div>

    <script>
      function updateDisplay() {
        let data = localStorage.getItem("livePosData");
        let list = document.getElementById("itemList");
        let totals = document.getElementById("totalsBox");

        if (!data) return;

        data = JSON.parse(data);

        // Xử lý trạng thái Thanh toán thành công
        if (data.status === "PAID") {
          list.innerHTML =
            '<div class="empty-state"><img src="https://cdn-icons-png.flaticon.com/512/1904/1904112.png" style="width: 100px; opacity: 0.5; margin-bottom: 20px;"><br><span style="color:#2ecc71; font-weight:bold; font-size: 24px;">Thanh toán thành công!</span><br><br>Xin cảm ơn quý khách.</div>';
          totals.style.display = "none";
          return;
        }

        // Xử lý trạng thái Không có gì (IDLE) - Ví dụ khi thu ngân xóa món về 0
        if (data.status === "IDLE" || (data.cart && data.cart.length === 0)) {
          list.innerHTML =
            '<div class="empty-state"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081840.png" style="width: 100px; opacity: 0.3; margin-bottom: 20px;"><br>Xin chào quý khách!<br>Vui lòng order tại quầy...</div>';
          totals.style.display = "none";
          return;
        }

        // Render giỏ hàng bình thường
        if (data.cart && data.cart.length > 0) {
          list.innerHTML = "";
          data.cart.forEach((item) => {
            let imgSrc = item.image
              ? item.image
              : "https://via.placeholder.com/80?text=F&B";

            list.innerHTML += `
                        <div class="item">
                            <img src="${imgSrc}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081840.png'">
                            <div class="item-info">
                                <div class="item-name">${item.htmlName}</div>
                            </div>
                            <div class="item-qty">x${item.qty}</div>
                            <div class="item-price">${item.total.toLocaleString()} đ</div>
                        </div>
                    `;
          });

          document.getElementById("tSub").innerText =
            data.subtotal.toLocaleString() + " đ";
          document.getElementById("tDis").innerText =
            "-" + data.discount.toLocaleString() + " đ";
          document.getElementById("tTot").innerText =
            data.total.toLocaleString() + " đ";

          document.getElementById("qrBox").style.display =
            data.payment.includes("Chuyển khoản") ? "block" : "none";
          totals.style.display = "block";
        }
      }

      window.addEventListener("storage", updateDisplay);
      updateDisplay();
    </script>
  </body>
</html>
